<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vocabula Latein</title>
<meta name="theme-color" content="#2B5C8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocabula">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<style>

:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#17202C; --ink-2:#4A5566; --ink-3:#7A8596;
  --line:#D8DEE7; --accent:#2B5C8F; --accent-ink:#FFFFFF; --accent-soft:#DCE7F3; --gold:#B8860B; --gold-soft:#F6EBCD;
  --good:#1E7A4C; --good-soft:#DDF1E6; --bad:#B23A3A; --bad-soft:#F7E0E0;
  --display:"Cinzel",Georgia,serif; --body:"Atkinson Hyperlegible",-apple-system,system-ui,sans-serif; --latin:"Crimson Pro",Georgia,serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0F141B; --surface:#18202B; --surface-2:#1F2935; --ink:#E8EDF3; --ink-2:#B3BDCA; --ink-3:#8793A3;
  --line:#2C3746; --accent:#7FB0E3; --accent-ink:#0F141B; --accent-soft:#1F3347; --gold:#E0B64A; --gold-soft:#3A3120;
  --good:#6FCF9B; --good-soft:#173527; --bad:#F08A8A; --bad-soft:#3E1F22;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0F141B; --surface:#18202B; --surface-2:#1F2935; --ink:#E8EDF3; --ink-2:#B3BDCA; --ink-3:#8793A3;
  --line:#2C3746; --accent:#7FB0E3; --accent-ink:#0F141B; --accent-soft:#1F3347; --gold:#E0B64A; --gold-soft:#3A3120;
  --good:#6FCF9B; --good-soft:#173527; --bad:#F08A8A; --bad-soft:#3E1F22;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.45;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:env(safe-area-inset-top,0px) calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:14px 8px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.08em}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;letter-spacing:.04em;color:var(--ink-3)}
.sync{font-size:12px;color:var(--ink-3);white-space:nowrap}
h2{font-family:var(--display);font-size:19px;letter-spacing:.05em;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
p{margin:0}
.muted{color:var(--ink-3);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:12px 16px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.good{background:var(--good-soft);color:var(--good);border-color:transparent}
button.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
button.ghost{background:transparent}
button.small{min-height:36px;padding:6px 12px;font-size:14px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.chip:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.grow{flex:1 1 0;min-width:0}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:120px;resize:vertical}
label.lbl{font-size:13px;color:var(--ink-2);font-weight:700;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
label.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;user-select:none}
label.chip input{position:absolute;opacity:0;pointer-events:none}
label.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:10px 6px;font-size:14px;cursor:pointer;background:var(--surface-2)}
.seg label+label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:700}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;background:transparent;border:0;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--ink-3);min-height:54px;padding:4px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* quiz */
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tablet{background:var(--gold-soft);border-radius:var(--radius);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.tablet .dir{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.tablet .word{font-family:var(--latin);font-size:34px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.answer{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;font-size:20px;font-weight:700;overflow-wrap:anywhere}
.answer.latin{font-family:var(--latin);font-size:24px}
.yours{font-size:14px;color:var(--ink-2);text-align:center}

/* grade stamp */
.result{display:flex;gap:18px;align-items:center}
.stamp{flex:0 0 auto;width:104px;height:104px;border-radius:50%;border:4px double var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);color:var(--gold)}
.stamp b{font-family:var(--display);font-size:46px;line-height:1}
.stamp span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.stamp.g1,.stamp.g2{color:var(--good);border-color:var(--good)}
.stamp.g5,.stamp.g6{color:var(--bad);border-color:var(--bad)}
.miss{display:flex;flex-direction:column;gap:6px}
.miss div{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;background:var(--bad-soft);border-radius:8px;font-size:15px}
.miss div b{font-family:var(--latin);font-size:17px}

/* vocab table */
.vtable{width:100%;border-collapse:collapse;font-size:15px}
.vtable td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.vtable td.la{font-family:var(--latin);font-size:17px;font-weight:600}
.vtable input{min-height:38px;padding:6px 8px}
.vtable td.x{width:40px;text-align:right}
.scroll{overflow-x:auto}
.listitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.listitem:last-child{border-bottom:0}
.listitem .name{font-weight:700}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold-soft);color:var(--ink-2);border-radius:6px;padding:2px 6px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* text exercise */
.latintext{font-family:var(--latin);font-size:21px;line-height:1.6;background:var(--gold-soft);border-radius:var(--radius);padding:18px}
.latintext .ttl{font-family:var(--display);font-size:16px;letter-spacing:.06em;display:block;margin-bottom:6px}
.solution{font-size:17px;line-height:1.6;background:var(--good-soft);border-radius:var(--radius);padding:16px}
.hints{font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{font-size:26px;font-weight:700;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* grade table */
.gtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.gtable th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;padding:6px 4px}
.gtable td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}
.gtable td.n{font-family:var(--display);font-size:22px;width:44px}
.gtable td.range{color:var(--ink-2);font-size:14px;white-space:nowrap}
.gtable input{width:84px;text-align:center}
.warn{color:var(--bad);font-size:14px}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.hist .h:last-child{border-bottom:0}
.hist .g{font-family:var(--display);font-size:20px;width:30px;text-align:center}
.spin{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}.progress>i{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.confirm{background:var(--bad-soft);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

.ocrbar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.ocrbar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.colmap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sent{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.sent:last-child{border-bottom:0}
.sent .l{font-family:var(--latin);font-size:18px;color:var(--ink-2)}
.sent .d{font-size:17px}
.foot{font-size:12px;color:var(--ink-3);text-align:center;padding-top:6px}
.btnrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">VOCABVLA<small>Latein üben · Vokabeln &amp; Übersetzen</small></div>
    <div class="sync" id="sync">auf diesem iPhone</div>
  </header>
  <section id="v-quiz" class="stack"></section>
  <section id="v-text" class="stack" hidden></section>
  <section id="v-lists" class="stack" hidden></section>
  <section id="v-grades" class="stack" hidden></section>
</div>

<nav class="tabs" aria-label="Bereiche"><div class="in">
  <button data-tab="quiz" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 12h8M12 8v8"/></svg>Abfrage</button>
  <button data-tab="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>Übersetzen</button>
  <button data-tab="lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-2"/><circle cx="12" cy="12" r="3.5"/></svg>Vokabeln</button>
  <button data-tab="grades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M8.5 13 7 21l5-3 5 3-1.5-8"/></svg>Noten</button>
</div></nav>

<script src="textgen.js"></script>
<script src="ocr-parse.js"></script>
<script src="app.js"></script>
</body>
</html>
